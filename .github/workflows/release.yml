name: Publish IA-RAG Core to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag!r}")
          release_version = tag[1:]
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          package_version = metadata["project"]["version"]
          if release_version != package_version:
              raise SystemExit(
                  f"release tag {release_version!r} does not match "
                  f"pyproject version {package_version!r}"
              )
          print(f"release_version={release_version}")
          PY

      - name: Install build and development tools
        run: |
          python -m pip install build
          python -m pip install '.[dev]'

      - name: Run public verification gates
        run: |
          python -m pytest -q
          python examples/reference_demo.py
          python -m pip check

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Verify built distribution version
        run: |
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          expected = importlib.metadata.version("ia-rag-core")
          artifacts = sorted(Path("dist").iterdir())
          names = {path.name for path in artifacts}
          expected_names = {
              f"ia_rag_core-{expected}-py3-none-any.whl",
              f"ia_rag_core-{expected}.tar.gz",
          }
          if names != expected_names:
              raise SystemExit(f"unexpected distribution files: {sorted(names)}")
          print(f"built_version={expected}")
          PY

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
